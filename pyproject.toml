[project]
name = "test-backend"
version = "0.1.0"
description = "Document processing API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "dbos>=2.28.0",
    "fastapi>=0.115",
    "puremagic>=2.0",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.10",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "secure>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.9",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
# ruff formats Python inside Markdown code blocks. README.md quotes the pipeline
# stubs verbatim and they must stay byte-for-byte as given.
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# app/pipeline/steps.py is the README's code, reproduced down to the blank
# lines. Import sorting would insert one; tests/unit/test_steps_contract.py
# diffs the file against the README and would fail.
"app/pipeline/steps.py" = ["I001"]

[tool.ruff.format]
# Same reason: the formatter would rewrite `1/3` as `1 / 3`, which quietly
# invalidates every latency number derived from the mocks.
exclude = ["app/pipeline/steps.py"]
