[project]
name = "test-backend"
version = "0.1.0"
description = "Document processing API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.10",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.9",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
# ruff formats Python inside Markdown code blocks. README.md quotes the pipeline
# stubs verbatim and they must stay byte-for-byte as given.
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
