services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      # The image has no shell and no curl, so probe with the Python we ship.
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
